<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Física · 2.º</title><style>body{font:17px system-ui;background:#0b1730;color:#edf4ff;margin:0}main{max-width:780px;margin:auto;padding:24px}.card{background:#192b4a;border:1px solid #365070;border-radius:18px;padding:22px;margin:15px 0}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #6683a5}button{cursor:pointer;background:#1c9d88;color:white;margin:5px}button:disabled{opacity:.45}.choice{display:block;width:100%;text-align:left;background:#263d5c}input{background:#fff;color:#111;width:95%;max-width:400px}.muted{color:#b4c9df}.bar{height:12px;background:#33465d;border-radius:9px;overflow:hidden}.fill{height:100%;background:#31d6b3;width:100%}#app{min-height:300px}small{color:#b4c9df}</style><main><h1>🎓 Escuela Webster</h1><p class="muted">Profesor Roberto Rico Ramírez · Repaso del segundo parcial · Octubre 2026</p><h2>Física · 2.º</h2><div id="app" class="card"></div><p><small>Práctica formativa, no reproducción literal del examen. El tiempo orienta; se permite ampliación. Los resultados permanecen en el dispositivo hasta que se descargan.</small></p></main><script>const bank=[["Gravitación", "La fuerza gravitacional entre dos masas al duplicar su distancia:", ["Se duplica", "Se reduce a la mitad", "Se reduce a la cuarta parte", "No cambia"], 2, "La fuerza depende de 1/r²."], ["Electricidad", "Una corriente de 2 A durante 5 s transporta una carga de:", ["2.5 C", "7 C", "10 C", "20 C"], 2, "Q = I × t."], ["Ley de Ohm", "Con 12 V y resistencia 4 Ω, la corriente es:", ["3 A", "8 A", "16 A", "48 A"], 0, "I = V/R."], ["Circuitos", "En un circuito en serie, la corriente:", ["Es igual en todos los elementos", "Se suma en cada resistencia", "Es cero siempre", "Depende solo del color del cable"], 0, "Existe una sola trayectoria."], ["Circuitos", "Dos resistencias de 3 Ω y 6 Ω en serie equivalen a:", ["2 Ω", "3 Ω", "9 Ω", "18 Ω"], 2, "En serie se suman resistencias."], ["Magnetismo", "Las líneas del campo magnético fuera de un imán van:", ["Del sur al norte", "Del norte al sur", "Solo hacia arriba", "No tienen dirección"], 1, "Por convención, fuera del imán van de N a S."], ["Ondas", "La luz visible es:", ["Onda sonora", "Onda electromagnética", "Corriente eléctrica", "Materia oscura"], 1, "Es radiación electromagnética."], ["Sistema solar", "¿Qué fuerza mantiene a los planetas en órbita?", ["Fricción", "Gravitación", "Electricidad estática", "Magnetismo terrestre"], 1, "La gravitación proporciona la aceleración orbital."], ["Movimiento", "Un móvil recorre 120 m en 20 s. Su rapidez media es:", ["4 m/s", "5 m/s", "6 m/s", "12 m/s"], 2, "v = d/t."], ["Energía", "Energía cinética de masa 2 kg a 3 m/s:", ["3 J", "6 J", "9 J", "18 J"], 2, "Ec = ½mv²."]];const app=document.getElementById('app');let phase='start',index=0,answers=[],remaining=600,extra=false,timer=null,student='',group='';function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(){if(phase==='start'){app.innerHTML='<h3>🚀 Misión de repaso</h3><p>10 retos de práctica con retroalimentación y después 5 preguntas de evaluación sin pistas.</p><label>Nombre o clave del alumno<br><input id="student" maxlength="70" placeholder="Nombre o clave"></label><p><label>Grupo<br><input id="group" maxlength="30" placeholder="Grupo"></label></p><button onclick="start()">Comenzar</button>';return}if(phase==='done'){let practice=answers.filter(x=>x.phase==='practica'),test=answers.filter(x=>x.phase==='evaluacion'),score=test.filter(x=>x.ok).length;let weak=[...new Set(test.filter(x=>!x.ok).map(x=>x.topic))];app.innerHTML='<h3>🏁 Resultados</h3><p><strong>'+esc(student)+'</strong> · '+esc(group)+'</p><h2>'+score+'/5 en evaluación ('+(score*20)+'%)</h2><p>Práctica: '+practice.filter(x=>x.ok).length+'/10 respuestas correctas al primer intento.</p><p>Temas para reforzar: '+esc(weak.join(', ')||'Ninguno detectado')+'</p><button onclick="download()">Descargar reporte CSV</button><button onclick="location.reload()">Reiniciar</button>';return}let evalMode=phase==='evaluation',total=evalMode?5:10,q=evalMode?bank[(index*2+1)%10]:bank[index];let mins=Math.floor(remaining/60),secs=remaining%60;app.innerHTML='<div style="display:flex;justify-content:space-between;gap:8px"><b>'+(evalMode?'Evaluación individual':'Práctica guiada')+' · '+(index+1)+'/'+total+'</b><b id="clock">'+mins+':'+String(secs).padStart(2,'0')+'</b></div><div class="bar"><div class="fill" id="fill" style="width:'+remaining/600*100+'%"></div></div><p class="muted">'+esc(q[0])+'</p><h3>'+esc(q[1])+'</h3><div id="options">'+q[2].map((x,i)=>'<button class="choice" onclick="pick('+i+')">'+String.fromCharCode(65+i)+'. '+esc(x)+'</button>').join('')+'</div><div id="feedback"></div><p><button onclick="extend()" '+(extra?'disabled':'')+'>+5 minutos</button> <button onclick="finish()">Terminar etapa</button></p>'}function start(){student=document.getElementById('student').value.trim()||'Sin nombre';group=document.getElementById('group').value.trim();phase='practice';index=0;remaining=600;show();timer=setInterval(()=>{if(phase==='done')return;remaining=Math.max(0,remaining-1);let el=document.getElementById('clock');if(el)el.textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');let fill=document.getElementById('fill');if(fill)fill.style.width=remaining/600*100+'%';if(remaining===0){clearInterval(timer);let f=document.getElementById('feedback');if(f)f.textContent='Tiempo de referencia concluido. Puedes seguir respondiendo o terminar esta etapa.'}},1000)}function extend(){if(extra)return;remaining+=300;extra=true;show()}function pick(choice){let ev=phase==='evaluation',q=ev?bank[(index*2+1)%10]:bank[index],ok=choice===q[3];answers.push({phase:ev?'evaluacion':'practica',topic:q[0],question:q[1],choice:q[2][choice],correct:q[2][q[3]],ok});document.getElementById('options').innerHTML='';document.getElementById('feedback').innerHTML='<p><b>'+(ok?'✓ Correcto':'✗ A revisar')+'</b></p>'+(ev?'':'<p>'+esc(q[4])+'</p>')+'<button onclick="next()">Continuar →</button>'}function next(){index++;if(index>=(phase==='evaluation'?5:10)){finish()}else show()}function finish(){if(phase==='practice'){phase='evaluation';index=0;remaining=600;extra=false;clearInterval(timer);app.innerHTML='<h3>🧠 Evaluación final</h3><p>5 preguntas nuevas o de transferencia, sin pistas durante la respuesta. Tiempo orientativo: 10 minutos.</p><button onclick="beginEval()">Iniciar evaluación</button>'}else{phase='done';clearInterval(timer);show()}}function beginEval(){phase='evaluation';index=0;remaining=600;extra=false;show();clearInterval(timer);timer=setInterval(()=>{remaining=Math.max(0,remaining-1);let e=document.getElementById('clock');if(e)e.textContent=Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0');if(remaining===0)clearInterval(timer)},1000)}function download(){let rows=[['alumno','grupo','materia','fase','tema','pregunta','respuesta','correcta','acierto'],...answers.map(a=>[student,group,document.title,a.phase,a.topic,a.question,a.choice,a.correct,a.ok?'1':'0'])];let csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='reporte_'+document.title.replace(/[^a-z0-9]/gi,'_')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}show();</script></html>
